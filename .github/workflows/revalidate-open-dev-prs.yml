name: Revalidate open dev PRs

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  find-open-dev-prs:
    name: Re-run release validation on open dev PRs
    runs-on: ubuntu-latest
    steps:
      - name: Re-run validation only for open dev PRs already blocked by the bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Fetching open PRs targeting dev..."
          if ! pr_list_json="$(gh api "repos/${{ github.repository }}/pulls" \
            --method GET \
            --paginate \
            -f state=open \
            -f sort=updated \
            -f direction=desc \
            --jq '.[] | select(.base.ref == "dev" and (.draft == false)) | .number')"; then
            echo "Failed to fetch open dev PRs from the repository API."
            exit 1
          fi

          mapfile -t pr_numbers <<< "$pr_list_json"

          if [ "${#pr_numbers[@]}" -eq 0 ]; then
            echo "No open PRs targeting dev were found."
            exit 0
          fi

          found=false
          for pr_number in "${pr_numbers[@]}"; do
            [ -n "$pr_number" ] || continue

            if ! has_blocking_review=$(gh api "repos/${{ github.repository }}/pulls/$pr_number/reviews" \
              --method GET \
              --paginate \
              | jq -s -r 'flatten | any(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED" and ((.body // "") | startswith("Release version validation failed.")))') ; then
              echo "Failed to fetch reviews for PR #$pr_number."
              exit 1
            fi

            if [ "$has_blocking_review" != "true" ]; then
              echo "Skipping PR #$pr_number: no blocking release validation review found."
              continue
            fi

            found=true
            echo "Triggering validation for PR #$pr_number"
            gh workflow run release-version-validation.yml \
              --repo "${{ github.repository }}" \
              --ref dev \
              -f pr_number="$pr_number"
          done

          if [ "$found" != "true" ]; then
            echo "No open dev PRs are currently blocked by the release validation bot."
          fi
